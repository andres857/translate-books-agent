[paths]
glossary = "glossary/astro_en_es.csv"
style_guide = "glossary/style_guide.md"
do_not_translate = "glossary/do_not_translate.txt"
short_glossary = "glossary/astro_en_es_short.csv"
font_regular = "fonts/NotoSans-Regular.ttf"
font_symbols = "fonts/NotoSansSymbols-Regular.ttf"
font_symbols2 = "fonts/NotoSansSymbols2-Regular.ttf"

[language]
source = "en"
target = "es"
register = "español neutro latinoamericano"

[models]
translate = { model = "gpt-5.4-mini", effort = "low" }
labels = { model = "gpt-5.4-mini", effort = "minimal" }
shorten = { model = "gpt-5.4-mini", effort = "low" }
glossary = { model = "gpt-5.5", effort = "high" }
classify = { model = "gpt-5.4-mini", effort = "minimal" }
qa_judge = { model = "gpt-5.4-mini", effort = "low" }
review = { model = "gpt-5.5", effort = "high" }

[layout]
min_scale = 0.75
warn_scale = 0.80
vector_label_min_scale = 1.0
shorten_ratio = 1.10
short_label_threshold = 15

# Etiquetas <15: presupuesto geométrico en layout.shortening_budget, no ratio1.10.
render_dpi = 110

[batch]
pages_per_batch = 20
babeldoc_max_pages_per_part = 50
use_openai_batch_api = false
max_repeated_errors = 3

[qa]
max_non_text_pixel_diff = 0.01
batch_ok_ratio = 0.90
require_vlm = true
require_human_graphics = true

[triage]
scanned_char_threshold = 80
scanned_image_area_ratio = 0.80
scanned_warning_ratio = 0.30

[api]
timeout_seconds = 120
max_retries = 2

[ocr]
backend = "paddleocr"
language = "en"
device = "cpu"
llamaparse_enabled = false

[pricing]
# No copiar tarifas históricas como si fueran verificadas.
# Sin tarifa confirmada, registrar costo desconocido y uso real.

# La capa B consume cuota ChatGPT; no aplica descuento Batch API.
[provider]
backend = "codex_sdk"
codex_profile = "translator"
sandbox_dir = "work/.codex_llm_sandbox"
fallback = "none"
max_parallel = 2
timeout_seconds = 180

[quota]
backoff_seconds = [30, 120, 600]
pause_exit_code = 75

[batching]
max_chars_per_call = 6000
unit = "pages"

[tasks.translate_page]
model = "gpt-6-luna"
effort = "low"
prompt = "prompts/translate_page.md"
schema = "schemas/translate_page.json"

[tasks.translate_labels]
model = "gpt-6-luna"
effort = "low"
prompt = "prompts/translate_labels.md"
schema = "schemas/translate_labels.json"

[tasks.shorten]
model = "gpt-6-luna"
effort = "low"
prompt = "prompts/shorten.md"
schema = "schemas/shorten.json"

[tasks.classify_labels]
model = "gpt-6-luna"
effort = "low"
prompt = "prompts/classify_labels.md"
schema = "schemas/classify_labels.json"

[tasks.glossary_candidates]
model = "gpt-6-astra"
effort = "high"
prompt = "prompts/glossary_candidates.md"
schema = "schemas/glossary_candidates.json"

[tasks.qa_judge]
model = "gpt-6-luna"
effort = "low"
prompt = "prompts/qa_judge.md"
schema = "schemas/qa_judge.json"

[tasks.review]
model = "gpt-6-astra"
effort = "high"
prompt = "prompts/review.md"
schema = "schemas/review.json"

# Mapeo por disponibilidad: gpt-5.5 -> gpt-6-astra; gpt-5.4-mini -> gpt-6-luna.
# minimal no aparece en el catálogo de luna: se usa low y se documenta.
# [models] conserva los identificadores del diseño anterior como referencia;
# las llamadas nuevas se resuelven exclusivamente mediante [tasks].
